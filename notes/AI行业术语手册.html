<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 行业术语手册</title>
<style>
  :root{
    --bg:#1b1b1e; --surface:#242428; --surface2:#2c2c31;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --tx:#E9E7E2; --tx2:#A9A6A1; --tx3:#7A7873;
    --accent:#5DCAA5; --accent-dim:#1D9E75; --accent-bg:rgba(29,158,117,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(27,27,30,.92);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    padding:18px 28px 14px;
  }
  .hrow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; max-width:1400px; margin:0 auto}
  h1{font-size:17px; font-weight:500; margin:0; letter-spacing:.3px}
  .sub{font-size:12px; color:var(--tx3)}
  .searchwrap{max-width:1400px; margin:12px auto 0; position:relative}
  #q{
    width:100%; padding:10px 40px 10px 14px; font-size:14px;
    background:var(--surface); border:1px solid var(--line2);
    border-radius:8px; color:var(--tx); outline:none;
    font-family:inherit; transition:border-color .15s;
  }
  #q:focus{border-color:var(--accent-dim)}
  #q::placeholder{color:var(--tx3)}
  .cnt{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--tx3); pointer-events:none}
  .layout{display:grid; grid-template-columns:210px minmax(0,1fr); gap:28px; max-width:1400px; margin:0 auto; padding:24px 28px 90px}
  nav{position:sticky; top:130px; align-self:start; max-height:calc(100vh - 160px); overflow-y:auto}
  nav button{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    width:100%; text-align:left; padding:7px 10px; margin-bottom:2px;
    background:transparent; border:0; border-radius:6px; cursor:pointer;
    color:var(--tx2); font-size:13px; font-family:inherit; transition:all .12s;
  }
  nav button:hover{background:var(--surface2); color:var(--tx)}
  nav button.on{background:var(--accent-bg); color:var(--accent)}
  nav button span{font-size:11px; color:var(--tx3)}
  nav button.on span{color:var(--accent-dim)}
  .cat{margin-bottom:40px; scroll-margin-top:150px}
  .cat h2{font-size:15px; font-weight:500; margin:0 0 4px; color:var(--tx)}
  .cat .meta{font-size:12px; color:var(--tx3); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--line)}
  .term{padding:13px 16px; margin-bottom:8px; background:var(--surface); border:1px solid var(--line); border-radius:9px; transition:border-color .15s}
  .term:hover{border-color:var(--line2)}
  .term .n{font-size:14px; font-weight:500; color:var(--accent); margin-bottom:4px}
  .term .n em{font-style:normal;color:var(--tx3);font-weight:400;font-size:12px;margin-left:6px}
  .term .d{color:var(--tx2); font-size:13.5px}
  .term mark{background:rgba(93,202,165,.25); color:var(--tx); border-radius:2px; padding:0 2px}
  .empty{text-align:center; padding:70px 20px; color:var(--tx3); font-size:14px}
  .tip{font-size:12px; color:var(--tx3); margin-bottom:22px; padding:10px 14px; background:var(--surface); border-radius:8px; border-left:2px solid var(--accent-dim)}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr; gap:0; padding:18px 16px 70px}
    nav{position:static; display:flex; flex-wrap:wrap; gap:6px; max-height:none; margin-bottom:22px; overflow:visible}
    nav button{width:auto; font-size:12px}
    nav button span{display:none}
    header{padding:14px 16px 12px}
    .cat{margin-bottom:30px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>AI 行业术语手册</h1>
    <div class="sub">按领域分组 · 可搜索 · 面向计算机专业入门者</div>
  </div>
  <div class="searchwrap">
    <input id="q" type="text" placeholder="搜索术语，比如 SQL、Agent、Harness、八股文……" autocomplete="off">
    <span class="cnt" id="cnt"></span>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

    ['Go','谷歌出品，语法简单、并发能力强、编译快，是云原生和后端基础设施的热门选择。Docker、Kubernetes 都是用 Go 写的。'],
    ['Rust','以内存安全和高性能著称，不依赖垃圾回收就能保证安全，因此学习曲线极陡。正在进入操作系统、数据库、AI 基础设施等底层领域。'],

    ['调试器 / GDB','让程序暂停在指定位置、查看变量当前值的工具。GDB 是 C/C++ 的标准调试器，在 VSCode 里可以图形化地使用它。'],

    ['IDE（集成开发环境）','把代码编辑、编译、调试、代码提示集成在一起的软件，如 Visual Studio、CLion、PyCharm。功能全但笨重。'],

{

    ['前端 / 后端 / 全栈','前端是用户看得见的部分（页面和交互）；后端是服务器上的业务逻辑和数据处理；全栈是两边都能做。'],

    ['状态码','服务器对请求的回应代码。200 表示成功，404 表示资源不存在，401 表示未登录，403 表示没权限，500 表示服务器内部出错。看到报错先看状态码。'],

    ['SDK（软件开发工具包）','比 API 更重的一套东西，通常包含开发工具、文档、示例代码，帮你更方便地接入某个平台或硬件。'],
    ['RESTful API','一种设计 API 的规范和风格，核心思想是“用 URL 表示资源、用 HTTP 方法表示操作”。是目前最主流的 API 形式。'],
    ['GraphQL','一种 API 查询语言，允许客户端精确指定“我要哪些字段”，避免服务端返回一大堆用不上的数据。由 Facebook 提出。'],
    ['JSON','一种数据格式，结构上很像 Python 的字典。目前前后端交换数据的事实标准。你调用大模型 API 时，请求体和响应基本都是 JSON。'],
    ['XML','更古老的数据格式，用标签包裹内容（形式类似 HTML）。现在主要用于配置文件和遗留系统。'],

    ['WebSocket','全双工通信协议。普通 HTTP 是“你问我答”，WebSocket 在建立连接后服务器可以主动推送消息。聊天应用、实时协作用它。'],
    ['SSE（Server-Sent Events）','服务器单向持续推送数据的协议。AI 聊天时那种“一个字一个字往外蹦”的流式效果，就是用 SSE 实现的。'],

    ['反向代理','用户以为在直接访问服务器，实际上中间隔了一层代理在转发。用途包括负载均衡、SSL 加密、限流和隐藏真实服务地址。'],

  ]
},
{
  cat:'数据库与数据',
  desc:'AI 应用的底座。RAG、知识库、数据分析，全都建立在数据能力之上。',

    ['SQL（结构化查询语言）','用来和关系型数据库对话的语言，全称 Structured Query Language。它本身不是编程语言，而是一种“声明式”语言——你只描述“我要什么数据”，不描述“怎么一步步取”。这是数据方向最必须的技能，没有之一，同时也是后端、数据分析、AI 工程岗的通用基本功。入门只学 SELECT / WHERE / JOIN / GROUP BY 就能干活。'],

{

{

const main = document.getElementById('main');
const nav = document.getElementById('nav');
const q = document.getElementById('q');
const cnt = document.getElementById('cnt');
let activeCat = null;

const total = DATA.reduce((s,c)=>s+c.terms.length,0);

function esc(s){ return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function hl(text, kw){
  const safe = esc(text);
  if(!kw) return safe;
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return safe.replace(re, m => '<mark>' + m + '</mark>');
}

function render(){
  const kw = q.value.trim();
  let shown = 0;
  let html = '';
  const navHtml = [];

  navHtml.push('<button data-cat="" class="' + (activeCat===null?'on':'') + '">全部术语<span>' + total + '</span></button>');

  DATA.forEach((c, ci) => {
    if(activeCat !== null && activeCat !== ci) {
      navHtml.push('<button data-cat="' + ci + '">' + esc(c.cat) + '<span>' + c.terms.length + '</span></button>');
      return;
    }
    const hit = c.terms.filter(t =>
      !kw || (t[0] + t[1]).toLowerCase().includes(kw.toLowerCase())
    );
    navHtml.push('<button data-cat="' + ci + '" class="' + (activeCat===ci?'on':'') + '">' + esc(c.cat) + '<span>' + hit.length + '</span></button>');
    if(!hit.length) return;
    shown += hit.length;
    html += '<section class="cat"><h2>' + esc(c.cat) + '</h2><div class="meta">' + esc(c.desc) + ' · 共 ' + hit.length + ' 条</div>';
    hit.forEach(t => {
      html += '<div class="term"><div class="n">' + hl(t[0], kw) + '</div><div class="d">' + hl(t[1], kw) + '</div></div>';
    });
    html += '</section>';
  });

  main.innerHTML = html || '<div class="empty">没有匹配的术语，换个关键词试试</div>';
  nav.innerHTML = navHtml.join('');
  cnt.textContent = kw ? shown + ' / ' + total : total + ' 条术语';

  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.cat;
      activeCat = v === '' ? null : Number(v);
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
}

q.addEventListener('input', render);
render();
</script>
</body>
</html>
